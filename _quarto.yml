project:
  type: book
  output-dir: _book

book:
  title: "Lab Wiki"
  subtitle: "A practical handbook for lab members"
  author: "The (UN)Adaptive Mind Lab"
  date: last-modified
  language: en
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 2
  chapters:
    - index.qmd
    - part: "Getting started"
      chapters:
        - getting-started/index.qmd
        - getting-started/master-student.qmd
        - getting-started/phd-student.qmd
        - getting-started/postdoc.qmd
        - getting-started/living-and-settling-in.qmd
    - part: "Lab basics"
      chapters:
        - lab-basics/index.qmd
        - lab-basics/lab-values.qmd
        - lab-basics/open-science.qmd
        - lab-basics/data-flow.qmd
        - lab-basics/who-to-contact.qmd
        - lab-basics/meetings.qmd
        - lab-basics/administration.qmd
        - lab-basics/funding.qmd
        - lab-basics/conferences-and-journals.qmd
    - part: "Methods handbook"
      chapters:
        - methods/index.qmd
        - methods/before-data-collection.qmd
        - methods/online-experiments.qmd
        - methods/in-lab-experiments.qmd
        - methods/fmri.qmd
        - methods/pharmacology.qmd
        - methods/computational-modelling.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    anchor-sections: true
  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true

execute:
  freeze: auto

